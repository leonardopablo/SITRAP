openapi: 3.0.3
info:
  title: SITRAP API
  version: 0.1.0
  description: MVP de trazabilidad de leche. Contrato incremental; solo rutas implementadas.
paths:
  /api/v1/health:
    get:
      operationId: health_retrieve
      tags:
      - health
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
          description: ''
components:
  schemas:
    Health:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/StatusEnum'
      required:
      - status
    StatusEnum:
      enum:
      - ok
      type: string
      description: '* `ok` - ok'
