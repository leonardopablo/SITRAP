components:
  schemas:
    Animal:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        code:
          type: string
          maxLength: 32
        species_id:
          type: string
          format: uuid
        sex:
          $ref: '#/components/schemas/SexEnum'
        name:
          type: string
          maxLength: 100
        status:
          $ref: '#/components/schemas/AnimalStatusEnum'
      required:
      - code
      - id
      - sex
      - species_id
    AnimalCreateRequest:
      type: object
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
          minLength: 1
          maxLength: 32
        species_id:
          type: string
          format: uuid
        sex:
          $ref: '#/components/schemas/SexEnum'
        name:
          type: string
          default: ''
          maxLength: 100
        status:
          allOf:
          - $ref: '#/components/schemas/AnimalStatusEnum'
          default: ACTIVO
        stay_id:
          type: string
          format: uuid
        center_id:
          type: string
          format: uuid
        starts_on:
          type: string
          format: date
      required:
      - center_id
      - code
      - id
      - sex
      - species_id
      - starts_on
      - stay_id
    AnimalMetric:
      type: object
      properties:
        animal_id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        liters:
          type: string
          format: decimal
          pattern: ^-?\d{0,17}(?:\.\d{0,3})?$
        recorded_days:
          type: integer
        days_present:
          type: integer
        days_without_record:
          type: integer
        average_per_recorded_day:
          type: string
          format: decimal
          pattern: ^-?\d{0,17}(?:\.\d{0,3})?$
          nullable: true
      required:
      - animal_id
      - average_per_recorded_day
      - code
      - days_present
      - days_without_record
      - liters
      - name
      - recorded_days
    AnimalStatusEnum:
      enum:
      - ACTIVO
      - INACTIVO
      type: string
      description: |-
        * `ACTIVO` - Activo
        * `INACTIVO` - Inactivo
    ArrivalSaleRequest:
      type: object
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500
        delivered_to_client:
          type: boolean
        physical_responsible:
          type: string
          minLength: 1
          maxLength: 150
        reference:
          type: string
          minLength: 1
          maxLength: 150
      required:
      - delivered_to_client
      - physical_responsible
      - reason
      - reference
    Assignment:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        role:
          type: string
        scope:
          $ref: '#/components/schemas/ScopeEnum'
        location_id:
          type: string
          format: uuid
          nullable: true
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
          nullable: true
      required:
      - id
      - location_id
      - role
      - scope
    BalanceOutput:
      type: object
      properties:
        category:
          $ref: '#/components/schemas/CuyCategoryEnum'
        quality:
          $ref: '#/components/schemas/CuyQualityEnum'
        quantity:
          type: integer
      required:
      - category
      - quality
      - quantity
    BatchOperationResult:
      type: object
      properties:
        event_id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/BatchOperationStatusEnum'
        entity_id:
          type: string
          format: uuid
        lock_version:
          type: integer
          nullable: true
        result:
          type: object
          additionalProperties: {}
        error:
          type: object
          additionalProperties: {}
          nullable: true
        server_received_at:
          type: string
          format: date-time
        persisted:
          type: boolean
        http_status:
          type: integer
      required:
      - entity_id
      - error
      - event_id
      - http_status
      - lock_version
      - persisted
      - result
      - server_received_at
      - status
    BatchOperationStatusEnum:
      enum:
      - APLICADA
      - RECHAZADA
      - ESPERA_DEPENDENCIA
      - NO_PROCESADA
      type: string
      description: |-
        * `APLICADA` - APLICADA
        * `RECHAZADA` - RECHAZADA
        * `ESPERA_DEPENDENCIA` - ESPERA_DEPENDENCIA
        * `NO_PROCESADA` - NO_PROCESADA
    BatchResponse:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/BatchOperationResult'
        reprocessed:
          type: array
          items:
            $ref: '#/components/schemas/BatchOperationResult'
      required:
      - reprocessed
      - results
    BirthPayloadRequest:
      type: object
      properties:
        date:
          type: string
          format: date
        reason:
          type: string
          minLength: 1
          maxLength: 500
        occupation_id:
          type: string
          format: uuid
        live:
          type: integer
          maximum: 10000
          minimum: 0
        stillborn:
          type: integer
          maximum: 10000
          minimum: 0
          default: 0
      required:
      - date
      - live
      - occupation_id
      - reason
    BucketInputRequest:
      type: object
      properties:
        occupation_id:
          type: string
          format: uuid
        pen_id:
          type: string
          format: uuid
        category:
          $ref: '#/components/schemas/CuyCategoryEnum'
        quality:
          allOf:
          - $ref: '#/components/schemas/CuyQualityEnum'
          default: SIN_CLASIFICAR
        quantity:
          type: integer
          maximum: 1000000
          minimum: 0
      required:
      - category
      - quantity
    CSRF:
      type: object
      properties:
        csrf_token:
          type: string
      required:
      - csrf_token
    CancelSaleRequest:
      type: object
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500
        payment_treatment:
          type: string
          minLength: 1
          maxLength: 500
      required:
      - reason
    Capability:
      type: object
      properties:
        code:
          type: string
        location_id:
          type: string
          format: uuid
          nullable: true
      required:
      - code
      - location_id
    CenterProductInput:
      type: object
      properties:
        id:
          type: string
          format: uuid
        center_id:
          type: string
          format: uuid
        product_id:
          type: string
          format: uuid
        enabled:
          type: boolean
          default: true
      required:
      - center_id
      - id
      - product_id
    CenterProductInputRequest:
      type: object
      properties:
        id:
          type: string
          format: uuid
        center_id:
          type: string
          format: uuid
        product_id:
          type: string
          format: uuid
        enabled:
          type: boolean
          default: true
      required:
      - center_id
      - id
      - product_id
    CenterSummary:
      type: object
      properties:
        center_id:
          type: string
          format: uuid
        name:
          type: string
        produced_liters:
          type: string
          format: decimal
          pattern: ^-?\d{0,17}(?:\.\d{0,3})?$
        picked_up_liters:
          type: string
          format: decimal
          pattern: ^-?\d{0,17}(?:\.\d{0,3})?$
        received_liters:
          type: string
          format: decimal
          pattern: ^-?\d{0,17}(?:\.\d{0,3})?$
      required:
      - center_id
      - name
      - picked_up_liters
      - produced_liters
      - received_liters
    CollectSaleRequest:
      type: object
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500
        physical_responsible:
          type: string
          minLength: 1
          maxLength: 150
        reference:
          type: string
          minLength: 1
          maxLength: 150
      required:
      - physical_responsible
      - reason
      - reference
    CommercialBaseRequest:
      type: object
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500
      required:
      - reason
    CompensatePayloadRequest:
      type: object
      properties:
        date:
          type: string
          format: date
        reason:
          type: string
          minLength: 1
          maxLength: 500
        movement_id:
          type: string
          format: uuid
      required:
      - date
      - movement_id
      - reason
    ComponentInputRequest:
      type: object
      properties:
        category:
          $ref: '#/components/schemas/SaleCategoryEnum'
        quality:
          $ref: '#/components/schemas/CuyQualityEnum'
        quantity:
          type: integer
          maximum: 100000
          minimum: 1
      required:
      - category
      - quality
      - quantity
    ConfigInputRequest:
      type: object
      properties:
        resource:
          $ref: '#/components/schemas/ResourceEnum'
        id:
          type: string
          format: uuid
        reason:
          type: string
          minLength: 1
          maxLength: 500
        center_id:
          type: string
          format: uuid
        shed_id:
          type: string
          format: uuid
        assignment_id:
          type: string
          format: uuid
        code:
          type: string
          minLength: 1
          pattern: ^[A-Z0-9][A-Z0-9_-]{0,39}$
        name:
          type: string
          minLength: 1
          maxLength: 150
        active:
          type: boolean
          default: true
        capacity:
          type: integer
          maximum: 1000000
          minimum: 1
        purpose:
          $ref: '#/components/schemas/PurposeEnum'
        reproductive_months:
          type: integer
          maximum: 60
          minimum: 1
        minimum_weaned_per_female:
          type: string
          format: decimal
          pattern: ^-?\d{0,4}(?:\.\d{0,2})?$
      required:
      - id
      - reason
      - resource
    ConfigOutput:
      type: object
      properties:
        centers:
          type: array
          items:
            type: object
            additionalProperties: {}
        enabled_centers:
          type: array
          items:
            type: string
            format: uuid
        policies:
          type: array
          items:
            type: object
            additionalProperties: {}
        grants:
          type: array
          items:
            type: object
            additionalProperties: {}
      required:
      - centers
      - enabled_centers
      - grants
      - policies
    ConformSaleRequest:
      type: object
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500
        preparation_id:
          type: string
          format: uuid
        round:
          type: integer
          minimum: 1
        shed_ids:
          type: array
          items:
            type: string
            format: uuid
          maxItems: 100
      required:
      - preparation_id
      - reason
      - round
    Correction:
      type: object
      properties:
        id:
          type: string
          format: uuid
        transfer_id:
          type: string
          format: uuid
        transfer_lock_version:
          type: integer
        state:
          $ref: '#/components/schemas/CorrectionStateEnum'
        lock_version:
          type: integer
        requester_id:
          type: string
          format: uuid
        reason:
          type: string
        transport_approver_id:
          type: string
          format: uuid
        reception_approver_id:
          type: string
          format: uuid
        original_version:
          $ref: '#/components/schemas/TransferVersion'
        proposed_version:
          $ref: '#/components/schemas/TransferVersion'
        created_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
          nullable: true
        decisions:
          type: array
          items:
            $ref: '#/components/schemas/Decision'
        pending_approvers:
          type: array
          items:
            $ref: '#/components/schemas/PendingApprover'
        capabilities:
          type: array
          items:
            type: string
      required:
      - capabilities
      - created_at
      - decisions
      - finished_at
      - id
      - lock_version
      - original_version
      - pending_approvers
      - proposed_version
      - reason
      - reception_approver_id
      - requester_id
      - state
      - transfer_id
      - transfer_lock_version
      - transport_approver_id
    CorrectionAcceptCommandRequest:
      type: object
      properties:
        event_id:
          type: string
          format: uuid
        device_id:
          type: string
          format: uuid
        type:
          allOf:
          - $ref: '#/components/schemas/CorrectionAcceptCommandTypeEnum'
          default: CORRECTION_ACCEPT
        entity_id:
          type: string
          format: uuid
        occurred_at:
          type: string
          format: date-time
        expected_version:
          type: integer
          minimum: 1
        depends_on:
          type: array
          items:
            type: string
            format: uuid
          maxItems: 100
        payload:
          $ref: '#/components/schemas/VersionPayloadRequest'
      required:
      - device_id
      - entity_id
      - event_id
      - expected_version
      - occurred_at
      - payload
    CorrectionAcceptCommandTypeEnum:
      enum:
      - CORRECTION_ACCEPT
      type: string
      description: '* `CORRECTION_ACCEPT` - CORRECTION_ACCEPT'
    CorrectionCreateCommandRequest:
      type: object
      properties:
        event_id:
          type: string
          format: uuid
        device_id:
          type: string
          format: uuid
        type:
          allOf:
          - $ref: '#/components/schemas/CorrectionCreateCommandTypeEnum'
          default: CORRECTION_CREATE
        entity_id:
          type: string
          format: uuid
        occurred_at:
          type: string
          format: date-time
        expected_version:
          type: integer
          minimum: 1
        depends_on:
          type: array
          items:
            type: string
            format: uuid
          maxItems: 100
        payload:
          $ref: '#/components/schemas/CorrectionPayloadRequest'
      required:
      - device_id
      - entity_id
      - event_id
      - expected_version
      - occurred_at
      - payload
    CorrectionCreateCommandTypeEnum:
      enum:
      - CORRECTION_CREATE
      type: string
      description: '* `CORRECTION_CREATE` - CORRECTION_CREATE'
    CorrectionCreateReceipt:
      type: object
      properties:
        event_id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/OperationStateEnum'
        entity_id:
          type: string
          format: uuid
        lock_version:
          type: integer
          nullable: true
        result:
          $ref: '#/components/schemas/CorrectionCreated'
        error:
          type: object
          additionalProperties: {}
          nullable: true
        server_received_at:
          type: string
          format: date-time
      required:
      - entity_id
      - error
      - event_id
      - lock_version
      - result
      - server_received_at
      - status
    CorrectionCreated:
      type: object
