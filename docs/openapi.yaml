openapi: 3.0.3
info:
  title: SITRAP API
  version: 0.1.0
  description: MVP de trazabilidad de leche. Contrato incremental; solo rutas implementadas.
paths:
  /api/v1/auth/change-password:
    post:
      operationId: auth_change_password_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/auth/csrf:
    get:
      operationId: auth_csrf_retrieve
      tags:
      - auth
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CSRF'
          description: ''
  /api/v1/auth/login:
    post:
      operationId: auth_login_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/auth/logout:
    post:
      operationId: auth_logout_create
      tags:
      - auth
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/auth/me:
    get:
      operationId: auth_me_retrieve
      tags:
      - auth
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/devices:
    post:
      operationId: devices_create
      tags:
      - devices
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceInputRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DeviceInputRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DeviceInputRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/devices/current:
    get:
      operationId: devices_current_retrieve
      parameters:
      - in: header
        name: X-Device-ID
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - devices
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/health:
    get:
      operationId: health_retrieve
      tags:
      - health
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
          description: ''
  /api/v1/role-assignments:
    get:
      operationId: role_assignments_list
      parameters:
      - name: limit
        required: false
        in: query
        description: Número de resultados a devolver por página.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: El índice inicial a partir del cual devolver los resultados.
        schema:
          type: integer
      tags:
      - role-assignments
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedRoleAssignmentAdminList'
          description: ''
    post:
      operationId: role_assignments_create
      tags:
      - role-assignments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAssignmentRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CreateAssignmentRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreateAssignmentRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleAssignmentAdmin'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/role-assignments/{id}:
    patch:
      operationId: role_assignments_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - role-assignments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUpdateAssignmentRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUpdateAssignmentRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUpdateAssignmentRequest'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleAssignmentAdmin'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/users:
    get:
      operationId: users_list
      parameters:
      - name: limit
        required: false
        in: query
        description: Número de resultados a devolver por página.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: El índice inicial a partir del cual devolver los resultados.
        schema:
          type: integer
      tags:
      - users
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedUserAdminList'
          description: ''
    post:
      operationId: users_create
      tags:
      - users
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserAdmin'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/users/{id}:
    patch:
      operationId: users_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - users
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUpdateUserRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUpdateUserRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUpdateUserRequest'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserAdmin'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/users/{id}/reset-password:
    post:
      operationId: users_reset_password_create
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - users
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserAdmin'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
components:
  schemas:
    Assignment:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        role:
          type: string
        scope:
          $ref: '#/components/schemas/ScopeEnum'
        location_id:
          type: string
          format: uuid
          nullable: true
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
          nullable: true
      required:
      - id
      - location_id
      - role
      - scope
    CSRF:
      type: object
      properties:
        csrf_token:
          type: string
      required:
      - csrf_token
    Capability:
      type: object
      properties:
        code:
          type: string
        location_id:
          type: string
          format: uuid
          nullable: true
      required:
      - code
      - location_id
    CreateAssignmentRequest:
      type: object
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        role:
          $ref: '#/components/schemas/RoleEnum'
        scope:
          $ref: '#/components/schemas/ScopeEnum'
        location_id:
          type: string
          format: uuid
          nullable: true
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
          nullable: true
      required:
      - id
      - location_id
      - role
      - scope
      - starts_at
      - user_id
    CreateUserRequest:
      type: object
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
          minLength: 1
          maxLength: 150
        name:
          type: string
          minLength: 1
          maxLength: 150
        temporary_password:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 1024
      required:
      - id
      - name
      - temporary_password
      - username
    Device:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          readOnly: true
        active:
          type: boolean
          readOnly: true
        prepared_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        preparation_expires_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        last_contact_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - active
      - id
      - last_contact_at
      - name
      - preparation_expires_at
      - prepared_at
    DeviceInputRequest:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 100
      required:
      - id
      - name
    Error:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        field_errors:
          type: object
          additionalProperties: {}
        retryable:
          type: boolean
      required:
      - code
      - field_errors
      - message
      - retryable
    Health:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/StatusEnum'
      required:
      - status
    KindEnum:
      enum:
      - CENTRO
      - PUNTO_VENTA
      type: string
      description: |-
        * `CENTRO` - Centro
        * `PUNTO_VENTA` - Punto Venta
    LocationSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        code:
          type: string
          maxLength: 32
        name:
          type: string
          maxLength: 150
        kind:
          $ref: '#/components/schemas/KindEnum'
      required:
      - code
      - id
      - kind
      - name
    LoginRequest:
      type: object
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 150
        password:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 1024
      required:
      - password
      - username
    Me:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        username:
          type: string
          title: Nombre de usuario
          description: 'Requerido. 150 carácteres como máximo. Únicamente letras,
            dígitos y @/./+/-/_ '
          pattern: ^[\w.@+-]+$
          maxLength: 150
        name:
          type: string
          maxLength: 150
        password_change_required:
          type: boolean
        assignments:
          type: array
          items:
            $ref: '#/components/schemas/Assignment'
          readOnly: true
        locations:
          type: array
          items:
            $ref: '#/components/schemas/LocationSummary'
          readOnly: true
        capabilities:
          type: array
          items:
            $ref: '#/components/schemas/Capability'
          readOnly: true
      required:
      - assignments
      - capabilities
      - id
      - locations
      - name
      - username
    PaginatedRoleAssignmentAdminList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?offset=400&limit=100
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?offset=200&limit=100
        results:
          type: array
          items:
            $ref: '#/components/schemas/RoleAssignmentAdmin'
    PaginatedUserAdminList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?offset=400&limit=100
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?offset=200&limit=100
        results:
          type: array
          items:
            $ref: '#/components/schemas/UserAdmin'
    PasswordRequest:
      type: object
      properties:
        old_password:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 1024
        new_password:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 1024
      required:
      - new_password
      - old_password
    PatchedUpdateAssignmentRequest:
      type: object
      properties:
        ends_at:
          type: string
          format: date-time
          nullable: true
    PatchedUpdateUserRequest:
      type: object
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 150
        name:
          type: string
          minLength: 1
          maxLength: 150
        is_active:
          type: boolean
    ResetPasswordRequest:
      type: object
      properties:
        temporary_password:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 1024
      required:
      - temporary_password
    RoleAssignmentAdmin:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        user_id:
          type: string
          format: uuid
        role:
          type: string
        scope:
          allOf:
          - $ref: '#/components/schemas/ScopeEnum'
          readOnly: true
        location_id:
          type: string
          format: uuid
          nullable: true
        starts_at:
          type: string
          format: date-time
          readOnly: true
        ends_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
      required:
      - ends_at
      - id
      - location_id
      - role
      - scope
      - starts_at
      - user_id
    RoleEnum:
      enum:
      - PRODUCCION
      - TRANSPORTE
      - RECEPCION
      - ADMIN
      type: string
      description: |-
        * `PRODUCCION` - Produccion
        * `TRANSPORTE` - Transporte
        * `RECEPCION` - Recepcion
        * `ADMIN` - Admin
    ScopeEnum:
      enum:
      - GLOBAL
      - UBICACION
      type: string
      description: |-
        * `GLOBAL` - Global
        * `UBICACION` - Ubicacion
    StatusEnum:
      enum:
      - ok
      type: string
      description: '* `ok` - ok'
    UserAdmin:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        username:
          type: string
          readOnly: true
          title: Nombre de usuario
          description: 'Requerido. 150 carácteres como máximo. Únicamente letras,
            dígitos y @/./+/-/_ '
        name:
          type: string
          readOnly: true
        is_active:
          type: boolean
          readOnly: true
          title: Activo
          description: Indica si el usuario debe ser tratado como activo. Desmarque
            esta opción en lugar de borrar la cuenta.
        password_change_required:
          type: boolean
          readOnly: true
      required:
      - id
      - is_active
      - name
      - password_change_required
      - username
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
