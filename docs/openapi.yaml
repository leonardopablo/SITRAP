components:
  schemas:
    Animal:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        code:
          type: string
          maxLength: 32
        species_id:
          type: string
          format: uuid
        sex:
          $ref: '#/components/schemas/SexEnum'
        name:
          type: string
          maxLength: 100
        status:
          $ref: '#/components/schemas/AnimalStatusEnum'
      required:
      - code
      - id
      - sex
      - species_id
    AnimalCreateRequest:
      type: object
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
          minLength: 1
          maxLength: 32
        species_id:
          type: string
          format: uuid
        sex:
          $ref: '#/components/schemas/SexEnum'
        name:
          type: string
          default: ''
          maxLength: 100
        status:
          allOf:
          - $ref: '#/components/schemas/AnimalStatusEnum'
          default: ACTIVO
        stay_id:
          type: string
          format: uuid
        center_id:
          type: string
          format: uuid
        starts_on:
          type: string
          format: date
      required:
      - center_id
      - code
      - id
      - sex
      - species_id
      - starts_on
      - stay_id
    AnimalStatusEnum:
      enum:
      - ACTIVO
      - INACTIVO
      type: string
      description: |-
        * `ACTIVO` - Activo
        * `INACTIVO` - Inactivo
    Assignment:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        role:
          type: string
        scope:
          $ref: '#/components/schemas/ScopeEnum'
        location_id:
          type: string
          format: uuid
          nullable: true
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
          nullable: true
      required:
      - id
      - location_id
      - role
      - scope
    CSRF:
      type: object
      properties:
        csrf_token:
          type: string
      required:
      - csrf_token
    Capability:
      type: object
      properties:
        code:
          type: string
        location_id:
          type: string
          format: uuid
          nullable: true
      required:
      - code
      - location_id
    CenterProductInput:
      type: object
      properties:
        id:
          type: string
          format: uuid
        center_id:
          type: string
          format: uuid
        product_id:
          type: string
          format: uuid
        enabled:
          type: boolean
          default: true
      required:
      - center_id
      - id
      - product_id
    CenterProductInputRequest:
      type: object
      properties:
        id:
          type: string
          format: uuid
        center_id:
          type: string
          format: uuid
        product_id:
          type: string
          format: uuid
        enabled:
          type: boolean
          default: true
      required:
      - center_id
      - id
      - product_id
    Correction:
      type: object
      properties:
        id:
          type: string
          format: uuid
        transfer_id:
          type: string
          format: uuid
        transfer_lock_version:
          type: integer
        state:
          $ref: '#/components/schemas/CorrectionStateEnum'
        lock_version:
          type: integer
        requester_id:
          type: string
          format: uuid
        reason:
          type: string
        transport_approver_id:
