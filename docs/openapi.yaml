components:
  schemas:
    Assignment:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        role:
          type: string
        scope:
          $ref: '#/components/schemas/ScopeEnum'
        location_id:
          type: string
          format: uuid
          nullable: true
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
          nullable: true
      required:
      - id
      - location_id
      - role
      - scope
    CSRF:
      type: object
      properties:
        csrf_token:
          type: string
      required:
      - csrf_token
    Capability:
      type: object
      properties:
        code:
          type: string
        location_id:
          type: string
          format: uuid
          nullable: true
      required:
      - code
      - location_id
    CenterProductInput:
      type: object
      properties:
        id:
          type: string
          format: uuid
        center_id:
          type: string
          format: uuid
        product_id:
          type: string
          format: uuid
        enabled:
          type: boolean
          default: true
      required:
      - center_id
      - id
      - product_id
    CenterProductInputRequest:
      type: object
      properties:
        id:
          type: string
          format: uuid
        center_id:
          type: string
          format: uuid
        product_id:
          type: string
          format: uuid
        enabled:
          type: boolean
          default: true
      required:
      - center_id
      - id
      - product_id
    CreateAssignmentRequest:
      type: object
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        role:
          $ref: '#/components/schemas/RoleEnum'
        scope:
          $ref: '#/components/schemas/ScopeEnum'
        location_id:
          type: string
          format: uuid
          nullable: true
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
          nullable: true
      required:
      - id
      - location_id
      - role
      - scope
      - starts_at
      - user_id
    CreateUserRequest:
      type: object
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
          minLength: 1
          maxLength: 150
        name:
          type: string
          minLength: 1
          maxLength: 150
        temporary_password:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 1024
      required:
      - id
      - name
      - temporary_password
      - username
    Device:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          readOnly: true
        active:
          type: boolean
          readOnly: true
        prepared_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        preparation_expires_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        last_contact_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - active
      - id
      - last_contact_at
      - name
      - preparation_expires_at
      - prepared_at
    DeviceInputRequest:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 100
      required:
      - id
      - name
    Error:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        field_errors:
          type: object
          additionalProperties: {}
        retryable:
          type: boolean
      required:
      - code
      - field_errors
      - message
      - retryable
    Health:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/StatusEnum'
      required:
      - status
    LocationInput:
      type: object
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
          maxLength: 32
        name:
          type: string
          maxLength: 150
        kind:
          $ref: '#/components/schemas/LocationInputKindEnum'
        active:
          type: boolean
          default: true
      required:
      - code
      - id
      - kind
      - name
    LocationInputKindEnum:
      enum:
      - CENTRO
      - PUNTO_VENTA
      type: string
      description: |-
        * `CENTRO` - CENTRO
        * `PUNTO_VENTA` - PUNTO_VENTA
    LocationInputRequest:
      type: object
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
          minLength: 1
          maxLength: 32
        name:
          type: string
          minLength: 1
          maxLength: 150
        kind:
          $ref: '#/components/schemas/LocationInputKindEnum'
        active:
          type: boolean
          default: true
      required:
      - code
      - id
      - kind
      - name
    LocationSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        code:
          type: string
          maxLength: 32
        name:
          type: string
          maxLength: 150
        kind:
          $ref: '#/components/schemas/LocationSummaryKindEnum'
      required:
      - code
      - id
      - kind
      - name
    LocationSummaryKindEnum:
      enum:
      - CENTRO
      - PUNTO_VENTA
      type: string
      description: |-
        * `CENTRO` - Centro
        * `PUNTO_VENTA` - Punto Venta
    LoginRequest:
      type: object
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 150
        password:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 1024
      required:
      - password
      - username
    Me:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        username:
          type: string
          title: Nombre de usuario
          description: 'Requerido. 150 carácteres como máximo. Únicamente letras,
            dígitos y @/./+/-/_ '
          pattern: ^[\w.@+-]+$
          maxLength: 150
        name:
          type: string
          maxLength: 150
        password_change_required:
          type: boolean
        assignments:
          type: array
          items:
            $ref: '#/components/schemas/Assignment'
          readOnly: true
        locations:
          type: array
          items:
            $ref: '#/components/schemas/LocationSummary'
          readOnly: true
        capabilities:
          type: array
          items:
            $ref: '#/components/schemas/Capability'
          readOnly: true
