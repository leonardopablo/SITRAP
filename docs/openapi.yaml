      - lock_version
      - transfer_id
    CorrectionDecisionReceipt:
      type: object
      properties:
        event_id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/OperationStateEnum'
        entity_id:
          type: string
          format: uuid
        lock_version:
          type: integer
          nullable: true
        result:
          $ref: '#/components/schemas/Correction'
        error:
          type: object
          additionalProperties: {}
          nullable: true
        server_received_at:
          type: string
          format: date-time
      required:
      - entity_id
      - error
      - event_id
      - lock_version
      - result
      - server_received_at
      - status
    CorrectionPayloadRequest:
      type: object
      properties:
        correction_id:
          type: string
          format: uuid
        version_id:
          type: string
          format: uuid
        line_id:
          type: string
          format: uuid
        units:
          type: string
          format: decimal
          pattern: ^-?\d{0,11}(?:\.\d{0,3})?$
        reason:
          type: string
          minLength: 1
          maxLength: 2000
      required:
      - correction_id
      - line_id
      - reason
      - units
      - version_id
    CorrectionRejectCommandRequest:
      type: object
      properties:
        event_id:
          type: string
          format: uuid
        device_id:
          type: string
          format: uuid
        type:
          allOf:
          - $ref: '#/components/schemas/CorrectionRejectCommandTypeEnum'
