name: Backend
on:
  push:
    branches: [agente-backend]
  pull_request:
    paths-ignore: ["frontend/**"]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: sitrap
          POSTGRES_USER: sitrap
          POSTGRES_PASSWORD: ci-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sitrap"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DEBUG: "True"
      SECRET_KEY: dev-ci-only-not-for-deployment
      DATABASE_URL: postgres://sitrap:ci-only-password@127.0.0.1:5432/sitrap
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 fonts-dejavu-core
      - run: python -m pip install --require-hashes -r requirements-dev.txt
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py migrate --noinput
      - run: python -m pytest
      - run: python -m ruff check .
      - run: python manage.py spectacular --file docs/openapi.yaml --validate --fail-on-warn
      - run: git diff --exit-code -- docs/openapi.yaml
